name: Release Windows NetEase helper

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file helper
        shell: pwsh
        run: |
          dotnet publish bridge/windows/Vinyll.NeteaseBridge/Vinyll.NeteaseBridge.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output release/windows
          Move-Item release/windows/Vinyll.NeteaseBridge.exe release/Vinyll.NeteaseBridge-win-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Vinyll.NeteaseBridge-win-x64
          path: release/Vinyll.NeteaseBridge-win-x64.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/Vinyll.NeteaseBridge-win-x64.exe
