name: Release NetEase helpers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Windows helper
        shell: pwsh
        run: |
          dotnet publish bridge/windows/Vinyll.NeteaseBridge/Vinyll.NeteaseBridge.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output release/windows
          Move-Item release/windows/Vinyll.NeteaseBridge.exe release/Vinyll.NeteaseBridge-win-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Vinyll.NeteaseBridge-win-x64
          path: release/Vinyll.NeteaseBridge-win-x64.exe

  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build Universal macOS helper
        run: ./scripts/build-macos-companion.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Vinyll.NeteaseCompanion-macOS-universal
          path: release/Vinyll.NeteaseCompanion-macOS-universal.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
